  name: CI/CD Pipeline
    
    on:
      push:
        branches: [ "main" ]
    
    jobs:
      # Job 1: Pruebas unitarias
      unit-tests:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - run: npm test
    
      # Job 2: Revisión de estilo (Corre AL MISMO TIEMPO que las pruebas)
      linter:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - run: npm run lint
    
      # Job 3: Despliegue (ESPERA a que terminen los dos anteriores)
      deploy:
        runs-on: ubuntu-latest
        needs: [unit-tests, linter] # <-- No inicia hasta que ambos pasen con éxito
        steps:
          - uses: actions/checkout@v4
          - run: npm run build
          - run: echo "Desplegando a Firebase..."
