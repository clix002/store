  name: CI/CD Pipeline
    
    on:
      push:
      workflow_dispatch:
        inputs:
          saludo:
            type: choice
            options: ["Hola", "Adiós"]
    
    
    jobs:
      # Job 1: Pruebas unitarias
      unit-tests:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - run: echo "hola ${{ github.actor }}; commit: ${{ github.sha }}"
          - run: echo "Elegiste: ${{ inputs.saludo }}"
